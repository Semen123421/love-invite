<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Важный вопрос 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #ffc3a0 100%);
    overflow: hidden;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 28px;
    padding: 48px 36px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(180, 80, 110, 0.25);
    position: relative;
    z-index: 2;
  }
  .emoji { font-size: 56px; margin-bottom: 16px; display: block; }
  h1 { font-size: 26px; color: #b03a5b; margin-bottom: 12px; line-height: 1.3; }
  p.sub { color: #8a6b74; font-size: 16px; margin-bottom: 32px; line-height: 1.5; }
  .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  button {
    border: none;
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    padding: 16px 36px;
    border-radius: 50px;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  #yesBtn {
    background: linear-gradient(135deg, #ff5e7e, #ff2d55);
    color: white;
    box-shadow: 0 8px 24px rgba(255, 45, 85, 0.4);
  }
  #yesBtn:hover { transform: scale(1.08); }
  #noBtn {
    background: #f0e6e9;
    color: #9a7580;
    position: relative;
  }
  #result { display: none; }
  #result h1 { color: #ff2d55; }
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .heart {
    position: absolute;
    font-size: 24px;
    animation: rise linear forwards;
  }
  @keyframes rise {
    from { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="question">
    <span class="emoji">💌</span>
    <h1>У меня к тебе один важный вопрос…</h1>
    <p class="sub">Пойдёшь со мной на свидание?</p>
    <div class="buttons">
      <button id="yesBtn">Да 💖</button>
      <button id="noBtn">Нет</button>
    </div>
  </div>

  <div id="result">
    <span class="emoji">🥳</span>
    <h1>Я знал, что ты скажешь «да»!</h1>
    <p class="sub" id="details">Тогда встретимся завтра, у кофейни Krems в 13:00<br> Нас ожидают разговоры по душам, одеваемся как душе угодно😉</p>
  </div>
</div>

<div class="hearts" id="hearts"></div>

<script>
  var yesBtn = document.getElementById('yesBtn');
  var noBtn = document.getElementById('noBtn');
  var question = document.getElementById('question');
  var result = document.getElementById('result');

  var noTexts = ['Нет', 'Ты уверена?', 'Точно-точно?', 'Подумай ещё 🤔', 'Может, всё-таки да?', 'Ну пожалуйста 🥺', 'Я расстроюсь 😢', 'Последний шанс!', 'Да?'];
  var noCount = 0;

  function escapeNo() {
    noCount++;
    if (noCount < noTexts.length) {
      noBtn.textContent = noTexts[noCount];
    }

    var padding = 10;
    var maxX = window.innerWidth - noBtn.offsetWidth - padding;
    var maxY = window.innerHeight - noBtn.offsetHeight - padding;
    var x = Math.random() * maxX;
    var y = Math.random() * maxY;

    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.zIndex = 100;

    var scale = 1 + Math.min(noCount * 0.08, 0.5);
    yesBtn.style.transform = 'scale(' + scale + ')';
  }

  noBtn.addEventListener('mouseenter', escapeNo);
  noBtn.addEventListener('touchstart', function(e) { e.preventDefault(); escapeNo(); });
  noBtn.addEventListener('click', escapeNo);

  yesBtn.addEventListener('click', function() {
    question.style.display = 'none';
    result.style.display = 'block';
    launchHearts();
  });

  function launchHearts() {
    var container = document.getElementById('hearts');
    var symbols = ['💖', '💕', '❤️', '💗', '🌹', '✨'];
    
    setInterval(function() {
      var h = document.createElement('div');
      h.className = 'heart';
     h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.bottom = '-40px';
      h.style.animationDuration = (3 + Math.random() * 3) + 's';
      h.style.fontSize = (16 + Math.random() * 24) + 'px';
      container.appendChild(h);
      
      setTimeout(function() {
        h.remove();
      }, 6000);
      
    }, 250);
  }
</script>
</body>
</html>
